[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# E/F = pycodestyle/pyflakes, I = import sorting, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["exchange_calendars.*"]
ignore_missing_imports = true
